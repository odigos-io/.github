# Org-scoped trust policy: lets the on-prem token workflows in odigos-enterprise
# keep the "On-prem tokens" org project in sync (Status, Issued, Expires).
# Organization projects are not a repository permission, which is why this
# policy lives in the org's .github repository and is requested with
# `scope: odigos-io`. Nothing else is granted.
issuer: https://token.actions.githubusercontent.com
subject_pattern: repo:odigos-io(@84347062)?/odigos-enterprise(@683608086)?:ref:refs/heads/main
claim_pattern:
  job_workflow_ref: odigos-io/odigos-enterprise/\.github/workflows/(generate-onprem-token|onprem-token-reminders)\.yml@refs/heads/main
permissions:
  organization_projects: write
